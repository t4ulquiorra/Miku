name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true
      is_draft:
        description: 'Publish as Draft release'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Keystore & Signing Properties
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "::notice title=Keystore::Configuring release keystore from GitHub Secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            cat << EOF > signing.properties
storeFile=release.keystore
storePassword=$KEYSTORE_PASSWORD
keyAlias=$KEY_ALIAS
keyPassword=$KEY_PASSWORD
EOF
          else
            echo "::warning title=Keystore::KEYSTORE_BASE64 secret not found. Falling back to debug signing."
          fi

      - name: Determine Version Name
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
          else
            EXTRACTED_VER=$(grep "versionName =" app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG_VERSION="v${EXTRACTED_VER:-release}"
          fi
          echo "tag_name=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_TAG=$TAG_VERSION" >> $GITHUB_ENV

      - name: Build Signed Release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Organize & Rename Release APKs
        run: |
          mkdir -p release-artifacts
          cd app/build/outputs/apk/release/
          for apk in *.apk; do
            if [ -f "$apk" ]; then
              NEW_NAME=$(echo "$apk" | sed "s/app-/miku-${{ steps.version.outputs.tag_name }}-/")
              cp "$apk" "${GITHUB_WORKSPACE}/release-artifacts/$NEW_NAME"
            fi
          done
          cd "${GITHUB_WORKSPACE}"
          ls -lh release-artifacts/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miku-${{ steps.version.outputs.tag_name }}-apks
          path: release-artifacts/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Miku ${{ steps.version.outputs.tag_name }}
          files: release-artifacts/*.apk
          draft: ${{ github.event.inputs.is_draft == 'true' }}
          prerelease: ${{ github.event.inputs.is_prerelease == 'true' }}
          generate_release_notes: true

      - name: Secure Cleanup
        if: always()
        run: rm -f release.keystore signing.properties
